name: "Integ Lint"

# Lint the AE integration harness on every PR that touches it. Needs no After
# Effects, licence or AWS credentials, so it runs on a GitHub-hosted runner.

on:
  pull_request:
    paths:
      - "test/integ/**"
      - "test/unit/test_integ_asset_hygiene.py"
      - "hatch.toml"
      - "requirements-testing.txt"
      - "requirements-integ.txt"
      - ".github/workflows/integ_lint.yml"
  push:
    branches: [mainline]
    paths:
      - "test/integ/**"
      - "test/unit/test_integ_asset_hygiene.py"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install hatch
        # virtualenv 21 dropped an API hatch 1.15 uses (same pin as the org build workflow).
        run: pip install "hatch==1.15.1" "virtualenv<21"

      - name: Lint harness (black + ruff)
        run: hatch run integ-lint:lint-check
