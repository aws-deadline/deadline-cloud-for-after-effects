specificationVersion: jobtemplate-2023-09
name:  {{JOBNAME}}
description: >
  A simple job bundle that allows a user to select a project and comp to render with aerender.
parameterDefinitions:
  - name: ProjectFile
    type: PATH
    objectType: FILE
    dataFlow: IN
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: Project file
      groupLabel: Source
      fileFilters:
        - label: After Effects project files
          patterns:
            - '*.aep'
            - '*.aepx'
        - label: All Files
          patterns:
            - '*'
    description: The After Effects project file to render.
  - name: RenderQueueIndex
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Render Queue Index
      groupLabel: Source
    description: The index of the item in the render queue to render.
    default: 1
  - name: OutputFile
    type: PATH
    objectType: FILE
    dataFlow: OUT
    userInterface:
      control: HIDDEN
      label: Output File
      groupLabel: Frame Range
    default: ~\Desktop\output
    description: The render output destination
  - name: FrameStarts
    type: STRING
    userInterface:
      control: LINE_EDIT
      label: Starting Frames
      groupLabel: Frame Range
    description: The start frame to render.
    default: 1-10
  - name: FrameEnds
    type: STRING
    userInterface:
      control: LINE_EDIT
      label: Ending Frames
      groupLabel: Frame Range
    description: The end frame to render.
    default: 1-10
  - name: ChunkSize
    type: INT
    userInterface:
      control: SPIN_BOX
      label: Chunk Size
      groupLabel: Frame Range
    description: The chunk size of frames to render per task.
    default: 1
  - name: FrameStartPlusChunkSizeMinusOne
    type: INT
    userInterface:
      control: SPIN_BOX
      label: FrameStart + ChunkSize - 1
      groupLabel: Frame Range
    description: This value needs to equal FrameStart + ChunkSize - 1
    default: FrameStart + ChunkSize - 1
  - name: FrameEndMinusOne
    type: INT
    userInterface:
      control: SPIN_BOX
      label: FrameEnd - 1
      groupLabel: Frame Range
    description: This value needs to equal FrameEnd - 1
    default: FrameEnd - 1

  # Hidden Controls
  - name: JobScriptDir
    description: Directory containing embedded scripts.
    userInterface:
      control: HIDDEN
    type: PATH
    objectType: DIRECTORY
    dataFlow: IN
    default: scripts

jobEnvironments:
  - name: 'Create Output Directories'
    description: 'Create Output Directories'
    script:
      actions:
        onEnter:
          command: powershell
          args:
            - "-File"
            - "{{Param.JobScriptDir}}/start.ps1"
            - "{{Param.OutputFile}}"

steps:
  - name: {{COMPNAME}}
    hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
    parameterSpace:
      taskParameterDefinitions:
      - name: FrameStart
        type: INT
        range: '{{Param.FrameStarts}}'
      - name: FrameEnd
        type: INT
        range: '{{Param.FrameEnds}}'
      combination: "(FrameStart, FrameEnd)"
    script:
      actions:
        onRun:
          command: powershell
          args:
            - "-File"
            - "{{Param.JobScriptDir}}/aerender.ps1"
            - '{{Param.ProjectFile}}'
            - '{{Param.RenderQueueIndex}}'
            - '{{Task.Param.FrameStart}}'
            - '{{Task.Param.FrameEnd}}'
            - '{{Param.OutputFile}}'
