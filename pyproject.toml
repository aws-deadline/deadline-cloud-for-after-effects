[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadline-cloud-for-after-effects"
version = "0.99.0"
description = "DEPRECATED PyPI package. AWS Deadline Cloud for After Effects is now delivered by the shared Deadline Cloud submitter installer; no separate adaptor package is needed."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Amazon Web Services" }]
keywords = ["deadline-cloud", "deprecated"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://docs.aws.amazon.com/deadline-cloud/latest/userguide/submitter.html"

[project.scripts]
afterfx-openjd = "deadline.ae_adaptor._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deadline"]

[tool.hatch.build.targets.sdist]
include = [
    "src/deadline",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml",
]
